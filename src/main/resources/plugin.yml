name: PumpkinMsg
version: '1.3'
main: com.pumpkin.msg.paper.PumpkinPaper
api-version: '1.20'
authors: [Pumpkingz]
softdepend: [PlaceholderAPI, LuckPerms]

commands:
  msg:
    aliases: [w, tell, message]
    description: Enviar un mensaje privado.
  reply:
    aliases: [r]
    description: Responder al último mensaje.
  socialspy:
    aliases: [spy]
    description: Activar el espionaje de mensajes.
  spycommands:
    aliases: [cmdspy]
    description: Activar el espionaje de comandos.
  ignore:
    description: Ignorar a un jugador.
  togglemsg:
    aliases: [tmsg, pmtoggle]
    description: Desactivar/Activar tus mensajes privados.
  pumpkinreload:
    description: Recargar la configuración del plugin.
